name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module version
        id: mod
        run: |
          version=$(grep '^version=' module.prop | cut -d= -f2-)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zipname=adb-root-enabler-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Build module ZIP
        run: |
          zip -r "${{ steps.mod.outputs.zipname }}" . \
            -x '.git/*' -x '.github/*' -x '*.zip'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.zipname }}
          path: ${{ steps.mod.outputs.zipname }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mod.outputs.version }}
          name: ${{ steps.mod.outputs.version }}
          files: ${{ steps.mod.outputs.zipname }}
          generate_release_notes: true
